# De app is statisch: er valt niets te bouwen, alleen te publiceren.
[build]
  publish = "budget"
  command = ""

# index.html en de service worker mogen nooit blijven hangen in een CDN- of
# browsercache. Doen ze dat wel, dan blijft een oude service worker draaien en
# krijgt niemand ooit de melding dat er een nieuwe versie klaarstaat.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# app.css en app.js hebben geen hash in hun naam, dus hier geldt hetzelfde:
# de service worker zorgt voor de versiebeheersing, niet de browsercache.
[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Iconen veranderen alleen als hun naam verandert.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
